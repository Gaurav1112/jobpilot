capabilities as a developer, which is all we need to make an accurate assessment for this role.</p>\n<p>In this role, you'll get the chance to:</p>\n<ul>\n <li><p>Drive large, complex projects autonomously, from technical design to launch</p></li>\n <li><p>Determine plans-of-attack on large projects</p></li>\n <li><p>Tackle complex architecture challenges, apply architectural standards and start using them on new projects</p></li>\n <li><p>Lead code reviews &amp; documentation as well as take on complex bug fixes, especially on high-risk problems</p></li>\n <li><p>Be an example for thorough, meaningful code reviews</p></li>\n <li><p>Partner across engineering teams to tackle company-wide initiatives spanning multiple projects</p></li>\n <li><p>Transfer your depth of knowledge from your current language to excel as a Java developer.</p></li>\n <li><p>Mentor more junior members</p></li>\n</ul>\n<h2>Compensation</h2>\n<p>At Atlassian, we strive to design equitable, explainable, and competitive compensation programs. We follow consistent hiring practices and account for each candidate's skills, knowledge, and experience when setting base pay within the range.</p>\n<p>This role may also be eligible for benefits, bonuses, commissions, and equity.</p>\n<h2>Qualifications</h2>\n<p>Sound like an exciting opportunity? We think so too... In order to set you up for impact on day one, we'll expect you to have this on your first day:</p>\n<ul>\n <li><p>You are not required to know a specific programming language, however expert-level experience with one or more prominent languages such as Java, Kotlin, Golang, Python, C#, C/C++, or Ruby is required.</p></li>\n <li><p>Highly-trusted knowledge in at least one domain and working knowledge in multiple tech domains</p></li>\n <li><p>Passion for collaborating with and mentoring junior members of the team</p></li>\n <li><p>Considers the customer impact when making technical decisions</p></li>\n <li><p>A real appetite for learning and growing, both as an individual and teammate.</p></li>\n</ul>\n<p><strong>Benefits &amp; Perks</strong></p>\n<p>Atlassian offers a wide range of perks and benefits designed to support you, your family and to help you engage with your local community. Our offerings include health and wellbeing resources, paid volunteer days, and so much more. To learn more, visit <strong><u>go.atlassian.com/perksandbenefits</u></strong><strong>.</strong></p>\n<p><strong>About Atlassian</strong></p>\n<p>At Atlassian, we're motivated by a common goal: to unleash the potential of every team. Our software products help teams all over the planet and our solutions are designed for all types of work. Team collaboration through our tools makes what may be impossible alone, possible together.</p>\n<p>We believe that the unique contributions of all Atlassians create our success. To ensure that our products and culture continue to incorporate everyone's perspectives and experience, we never discriminate based on race, religion, national origin, gender identity or expression, sexual orientation, age, or marital, veteran, or disability status. All your information will be kept confidential according to EEO guidelines.</p>\n<p>To provide you the best experience, we can support with accommodations or adjustments at any stage of the recruitment process. Simply inform our Recruitment team during your conversation with them.</p>\n<p>To learn more about our culture and hiring process, visit <strong><u>go.atlassian.com/crh</u></strong><strong>.</strong></p>\n<p><em>In line with local law, identity verification (which may include use of biometric data) is a condition of employment with Atlassian for employment fraud purposes.</em>&nbsp;</p>", "directApply": true, "title": "Senior Backend Software Engineer", "@context": "http://schema.org", "url": "https://careers-apac-atlassian.icims.com/jobs/25565/senior-backend-software-engineer/job", "jobLocationType": "TELECOMMUTE", "hiringOrganization": {"@type": "Orga
