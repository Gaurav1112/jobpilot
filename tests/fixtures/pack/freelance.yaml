# Freelance rules (fictional pack). Every value here is the shipped default, written out so it can be edited.
rateFloorUsdHour: 40
maxHoursPerWeek: 20
istWindow: "18:00-00:00"
derivedRateCountsForFloor: true
fixedBudgetFloorUsd: 500
fitFloor: 45
kinds: [contract, gig, bounty]
platforms:
  freelancer:
    enabled: true
    queries: [java, golang, typescript, node.js, react, aws, kafka, kubernetes, python, llm]
  remotive: { enabled: true, queries: [] }
  hn-freelancer: { enabled: true, queries: [] }
  hn-hiring: { enabled: true, queries: [] }
  boards: { enabled: true, queries: [] }
  gmail: { enabled: true, queries: [] }
  upwork: { enabled: false, queries: [] }
  reddit: { enabled: false, queries: [] }
  # Off in the fixture pack (the shipped default is on, with the default freelance keywords): the offline run fixtures
  # predate the source. tests/app/freelance/himalayas-gigs.test.ts runs it against its own recordings.
  himalayas: { enabled: false, queries: [] }
  # Off in the fixture pack (the shipped default is on): the offline run fixtures predate the sources;
  # tests/app/freelance/freelance-identity.test.ts pins the run without them. Each has its own tests and recordings.
  draftdev: { enabled: false, queries: [] }
  prime-intellect: { enabled: false, queries: [] }
  fractional-jobs: { enabled: false, queries: [] }
