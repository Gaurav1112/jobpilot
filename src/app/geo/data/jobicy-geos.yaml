# Jobicy's `geo` slugs per residence (profiles Task 15): the src-jobicy agent asks each slug in this order, a job
# found under two slugs kept once (the first). Every slug is one Jobicy lists at /api/v2/remote-jobs?get=locations
# (recorded 2026-10-16 in tests/fixtures/sources/jobicy-locations.json; a test checks every slug against it).
# Jobicy has no India slug and no North America slug. Order: the country's own slug, its regions' slugs (in
# regions.yaml order), then anywhere.
# Edit here, then run `node --run geo:gen` (a drift test checks data.generated.ts agrees).

# ISO 3166 alpha-2 code -> its slugs. IN is today's JOBICY_GEOS, in that order.
countries:
  IN: [apac, anywhere]
  AE: [united-arab-emirates, emea, anywhere]
  AR: [argentina, latam, anywhere]
  AT: [austria, europe, emea, anywhere]
