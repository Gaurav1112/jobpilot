# ISO 3166 alpha-2 code -> the region tokens (canonical PLACES names) that contain that country. Every code that
# norm.ts's ISO2 table knows is listed (UK too, as an alias of GB). `worldwide` is never listed: a residence scope
# always adds it. Edit here, then run `node --run geo:gen` (a drift test checks data.generated.ts agrees).

# South Asia
IN: [apac, asia, south asia]
PK: [apac, asia, south asia]
BD: [apac, asia, south asia]
LK: [apac, asia, south asia]
NP: [apac, asia, south asia]
# Southeast Asia
SG: [apac, asia, southeast asia]
MY: [apac, asia, southeast asia]
ID: [apac, asia, southeast asia]
PH: [apac, asia, southeast asia]
TH: [apac, asia, southeast asia]
VN: [apac, asia, southeast asia]
# East Asia
JP: [apac, asia]
CN: [apac, asia]
HK: [apac, asia]
TW: [apac, asia]
KR: [apac, asia]
# Oceania
AU: [apac, oceania]
NZ: [apac, oceania]
# North America
US: [americas, north america]
CA: [americas, north america]
# Latin America (Mexico is in North America too)
MX: [americas, north america, latam]
BR: [americas, latam]
AR: [americas, latam]
CL: [americas, latam]
CO: [americas, latam]
PE: [americas, latam]
UY: [americas, latam]
CR: [americas, latam]
